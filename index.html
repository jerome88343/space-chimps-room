<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>The Space Chimps</title>
<style>
  :root{
    --red:#D72D2D; --red-glow:#ff3b3b;
    --ink:#05060a; --glass:rgba(13,15,22,.74); --glass2:rgba(28,31,43,.7);
    --text:#F4F5FA; --dim:#8b8fa3; --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); background:var(--ink);
    display:grid; place-items:center; padding:28px 16px;
    min-height:100vh;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-2;
    background:url("assets/cosmos-bg.jpg") center/cover no-repeat;
    filter:saturate(1.15) brightness(.5) blur(2px); transform:scale(1.08);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1;
    background:radial-gradient(1100px 700px at 50% -5%, rgba(215,45,45,.20), transparent 60%),
               linear-gradient(180deg, rgba(5,6,10,.5), rgba(5,6,10,.94));
  }

  .console{
    width:100%; max-width:980px;
    display:grid; grid-template-columns:minmax(0,400px) minmax(0,1fr);
    background:var(--glass); backdrop-filter:blur(26px) saturate(1.25);
    -webkit-backdrop-filter:blur(26px) saturate(1.25);
    border:1px solid var(--line); border-radius:26px; overflow:hidden;
    box-shadow:0 40px 100px rgba(0,0,0,.65), 0 0 0 1px rgba(215,45,45,.10), 0 0 80px rgba(215,45,45,.14);
  }
  .console::before{ /* sharp top accent line */
    content:""; position:absolute; }
  @media(max-width:820px){ .console{grid-template-columns:1fr} }

  /* ===== LEFT STAGE ===== */
  .stage{
    padding:26px 26px 28px; border-right:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; gap:18px;
    background:linear-gradient(180deg, rgba(215,45,45,.08), transparent 40%);
  }
  @media(max-width:820px){ .stage{border-right:none; border-bottom:1px solid var(--line)} }

  .brand{display:flex; align-items:center; gap:13px; align-self:stretch}
  .brand img{width:60px; height:60px; border-radius:50%; flex:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.16), 0 0 26px rgba(215,45,45,.45)}
  .brand .name{font-size:19px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; line-height:1.05}
  .brand .name b{color:var(--red-glow); text-shadow:0 0 16px rgba(255,59,59,.65)}
  .brand .sub{font-size:10px; color:var(--dim); letter-spacing:.24em; text-transform:uppercase; margin-top:6px}

  .hero{
    position:relative; width:100%; max-width:300px; aspect-ratio:1; border-radius:16px; overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.6), 0 0 0 1px var(--line), 0 0 50px rgba(215,45,45,.22);
  }
  .hero img{width:100%; height:100%; object-fit:cover; display:block; transition:opacity .25s}
  .hero::after{content:""; position:absolute; inset:0; box-shadow:inset 0 0 60px rgba(0,0,0,.35); pointer-events:none}

  .now{align-self:stretch; text-align:center; min-height:42px}
  .now .nt{font-size:20px; font-weight:800; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .now .nc{font-size:11px; color:var(--red-glow); letter-spacing:.2em; text-transform:uppercase; margin-top:6px}

  .seek{align-self:stretch; display:flex; align-items:center; gap:10px}
  .seek .ti{font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; width:34px; text-align:center}
  input[type=range]{-webkit-appearance:none; appearance:none; height:5px; border-radius:5px;
    background:rgba(255,255,255,.15); accent-color:var(--red); cursor:pointer; flex:1}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:#fff; box-shadow:0 0 10px rgba(255,59,59,.85); border:none}

  .ctrlrow{align-self:stretch; position:relative; display:flex; align-items:center; justify-content:center; margin-top:2px}
  .ctrls{display:flex; align-items:center; gap:26px}
  .btn{background:none; border:none; color:var(--text); cursor:pointer; display:grid; place-items:center;
    padding:0; transition:transform .08s, color .14s}
  .btn:hover{color:#fff}
  .btn:active{transform:scale(.9)}
  .btn.side svg{width:26px; height:26px; fill:var(--dim)}
  .btn.side:hover svg{fill:#fff}
  .play{width:58px; height:58px; border-radius:50%; background:var(--red);
    box-shadow:0 10px 28px rgba(215,45,45,.55), 0 0 0 1px rgba(255,255,255,.14)}
  .play:hover{background:var(--red-glow)}
  .play svg{width:26px; height:26px; fill:#fff}
  .volrow{display:flex; align-items:center; justify-content:center; gap:9px; width:180px; align-self:center; margin-top:8px}
  .volrow svg{width:17px; height:17px; fill:var(--dim); flex:none}
  .volrow input{height:4px}

  /* ===== RIGHT PANEL ===== */
  .panel{display:flex; flex-direction:column; min-height:0}
  .tracks{padding:14px 16px; flex:1; display:flex; flex-direction:column; justify-content:center}

  .cat{margin:5px 4px}
  .cat:first-child{margin-top:0}
  .cat-head{display:flex; align-items:center; gap:12px; padding:5px 8px 7px}
  .cat-head .cover{width:46px; height:46px; border-radius:10px; object-fit:cover; flex:none;
    box-shadow:0 6px 18px rgba(0,0,0,.5), 0 0 0 1px var(--line)}
  .cat-head .cover.none{display:grid; place-items:center; background:#15171f; color:var(--red); font-size:20px}
  .cat-head .ct{font-size:15px; font-weight:800}
  .cat-head .cs{font-size:10px; color:var(--dim); letter-spacing:.16em; text-transform:uppercase; margin-top:4px}

  .trk{display:flex; align-items:center; gap:13px; padding:8px 12px; border-radius:11px; cursor:pointer;
    transition:background .14s}
  .trk:hover{background:var(--glass2)}
  .trk.active{background:linear-gradient(90deg, rgba(215,45,45,.20), rgba(215,45,45,.03))}
  .trk .ix{width:22px; flex:none; text-align:center; color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums}
  .trk.active .ix{display:none}
  .trk .eq{display:none; width:22px; height:16px; flex:none; align-items:flex-end; gap:2px; justify-content:center}
  .trk.active .eq{display:flex}
  .trk .eq span{width:3px; background:var(--red-glow); border-radius:2px; animation:eq .9s ease-in-out infinite}
  .trk .eq span:nth-child(1){height:40%; animation-delay:-.2s}
  .trk .eq span:nth-child(2){height:90%; animation-delay:-.5s}
  .trk .eq span:nth-child(3){height:60%; animation-delay:0s}
  @keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
  .trk.paused .eq span{animation-play-state:paused}
  .trk .nm{flex:1; font-size:15.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .trk.active .nm{color:#fff}
  .trk .dur{color:var(--dim); font-size:12.5px; font-variant-numeric:tabular-nums}

  .foot{grid-column:1/-1; text-align:center; color:var(--dim); font-size:10.5px; letter-spacing:.06em;
    padding:14px 10px 16px; border-top:1px solid var(--line); line-height:1.7}
</style>
</head>
<body>
<div class="console">

  <!-- LEFT: art + brand + controls -->
  <div class="stage">
    <div class="brand">
      <img src="assets/coin.jpg" alt="Space Chimps">
      <div>
        <div class="name">The Space <b>Chimps</b></div>
        <div class="sub">Private Listening Room</div>
      </div>
    </div>

    <div class="hero"><img id="npArt" src="assets/walking-upright.png" alt=""></div>

    <div class="now">
      <div class="nt" id="npTitle">Select a track</div>
      <div class="nc" id="npCat">Press play</div>
    </div>

    <div class="seek">
      <span class="ti" id="tCur">0:00</span>
      <input type="range" id="seek" value="0" min="0" max="1000" step="1">
      <span class="ti" id="tDur">0:00</span>
    </div>

    <div class="ctrlrow">
      <div class="ctrls">
        <button class="btn side" id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="btn play" id="play" title="Play"><svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg></button>
        <button class="btn side" id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
      </div>
    </div>
    <div class="volrow">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
    </div>
  </div>

  <!-- RIGHT: tracklist -->
  <div class="panel">
    <div class="tracks" id="tracks"></div>
  </div>

  <div class="foot">Private link &middot; please don&rsquo;t share &middot; best on headphones</div>
</div>

<audio id="audio" preload="none"></audio>

<script>
  const cats = [
    { title:"Walkin' Upright",    sub:"The Space Chimps Album", art:"assets/walking-upright.png" },
    { title:"New Stuff",          sub:"Fear and Loathing EP",   art:"assets/fear-loathing-ep.jpg" },
    { title:"Rough Jam Sessions", sub:"Unmixed, raw",           art:null }
  ];
  const tracks = [
    { nm:"C.H.I.M.P.",          dur:"3:41", src:"CHIMP.mp3",               c:0 },
    { nm:"Everything We Touch", dur:"2:33", src:"Everything We Touch.mp3", c:0 },
    { nm:"Keep Runnin'",        dur:"5:02", src:"Keep Running.mp3",        c:0 },
    { nm:"I Get High",          dur:"4:09", src:"I Get High_MIX.mp3",      c:1 },
    { nm:"Hope",                dur:"3:44", src:"Hope_MIX.mp3",            c:1 },
    { nm:"Dark Side",           dur:"3:37", src:"Dark Side_MIX.mp3",       c:1 },
    { nm:"Prostitute",          dur:"4:32", src:"Prostitute.mp3",          c:2 },
    { nm:"2 Coronas",           dur:"4:12", src:"2 Coronas.mp3",           c:2 },
    { nm:"Ape Shit",            dur:"4:55", src:"Ape Shit.mp3",            c:2 }
  ];

  const audio = document.getElementById('audio');
  const wrap  = document.getElementById('tracks');
  const npArt = document.getElementById('npArt'), npTitle = document.getElementById('npTitle'), npCat = document.getElementById('npCat');
  const seek = document.getElementById('seek'), tCur = document.getElementById('tCur'), tDur = document.getElementById('tDur');
  const playIcon = document.getElementById('playIcon');
  const ICON_PLAY = "M8 5v14l11-7z", ICON_PAUSE = "M6 5h4v14H6zM14 5h4v14h-4z";
  let current = -1, seeking = false;

  cats.forEach((cat, ci) => {
    const block = document.createElement('div'); block.className = 'cat';
    const cover = cat.art ? '<img class="cover" src="'+cat.art+'" alt="">' : '<div class="cover none">&#9834;</div>';
    block.innerHTML = '<div class="cat-head">'+cover+'<div><div class="ct">'+cat.title+'</div><div class="cs">'+cat.sub+'</div></div></div>';
    tracks.forEach((t, i) => {
      if (t.c !== ci) return;
      const row = document.createElement('div');
      row.className = 'trk'; row.dataset.i = i;
      row.innerHTML = '<span class="ix">'+(i+1)+'</span><span class="eq"><span></span><span></span><span></span></span>'+
        '<span class="nm">'+t.nm+'</span><span class="dur">'+t.dur+'</span>';
      row.onclick = () => play(i);
      block.appendChild(row);
    });
    wrap.appendChild(block);
  });
  const rows = [...document.querySelectorAll('.trk')];

  function fmt(s){ if(isNaN(s)) return "0:00"; s=Math.floor(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,'0'); }

  function play(i){
    const t = tracks[i], cat = cats[t.c];
    if(i !== current){
      current = i; audio.src = t.src;
      npArt.style.opacity = 0;
      setTimeout(()=>{ npArt.src = cat.art || "assets/coin.jpg"; npArt.style.opacity = 1; }, 120);
      npTitle.textContent = t.nm; npCat.textContent = cat.title;
    }
    audio.play().catch(()=>{});
  }
  function setActive(){ rows.forEach(r => r.classList.toggle('active', +r.dataset.i === current)); }

  audio.addEventListener('play', ()=>{ playIcon.setAttribute('d', ICON_PAUSE); setActive(); rows.forEach(r => r.classList.remove('paused')); });
  audio.addEventListener('pause', ()=>{ playIcon.setAttribute('d', ICON_PLAY); rows.forEach(r => { if(+r.dataset.i===current) r.classList.add('paused'); }); });

  document.getElementById('play').onclick = ()=>{ if(current === -1){ play(0); return; } audio.paused ? audio.play() : audio.pause(); };
  document.getElementById('prev').onclick = ()=>{ if(audio.currentTime > 3){ audio.currentTime = 0; return; } play((current<=0 ? tracks.length : current) - 1); };
  document.getElementById('next').onclick = ()=> play((current+1) % tracks.length);
  audio.addEventListener('ended', ()=>{ if(current+1 < tracks.length) play(current+1); });

  audio.addEventListener('loadedmetadata', ()=> tDur.textContent = fmt(audio.duration));
  audio.addEventListener('timeupdate', ()=>{ if(seeking || !audio.duration) return; seek.value = (audio.currentTime/audio.duration)*1000; tCur.textContent = fmt(audio.currentTime); });
  seek.addEventListener('input', ()=>{ seeking = true; tCur.textContent = fmt(audio.duration*(seek.value/1000)); });
  seek.addEventListener('change', ()=>{ audio.currentTime = audio.duration*(seek.value/1000); seeking = false; });
  document.getElementById('vol').addEventListener('input', e=> audio.volume = e.target.value);
</script>
</body>
</html>
